services:
  postgres-product:
    image : postgres:16
    environment:
      POSTGRES_USER: sultanbek
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: product-db
    ports:
      -5433:5432

  postgres-order:
    image: postgres:16
    environment:
      POSTGRES_USER: sultanbek
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: order-db
    ports:
      -5435:5432

  product-service :
    build: ./product-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://sultanbek:qwerty@postgres-product:5432/product-db?sslmode=disable

    depends_on:
      -postgres-product

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://sultanbek:qwerty@postgres-order:5432/order-db?sslmode=disable

    depends_on:
      -postgres-order


